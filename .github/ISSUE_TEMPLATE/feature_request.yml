name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task behind the request. For example, "clients ask for CVSS scores on every finding".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How it could work, and where (web UI, wizard, command line, report output).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds or other tools you use, if any.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Report content / templates
        - Word export
        - PDF export
        - Web UI
        - Command line / batch
        - Evidence, highlighting or redaction
        - OWASP / CWE mapping
        - Exe / installation
        - Other
