# Tests the project, builds the single-file Windows executable with PyInstaller and releases it.
#
# - Every push and pull request: run the tests, then build and smoke-test the .exe and attach it to the run.
# - Pushing a tag such as v1.0.0: also publishes a GitHub Release with the .exe and its SHA-256 checksum.
#   The tag must match __version__ in burp_report/__init__.py.
# - Can be started by hand from the Actions tab (workflow_dispatch).
# The exe is not code-signed; the release notes explain the SmartScreen prompt.
# Actions are pinned to full commit SHAs (version in the trailing comment), so a moved or hijacked tag can't
# change what runs here. Dependabot updates the SHA and the comment together.
name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["**.md"]   # documentation-only pushes don't build; tag pushes always do
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Unit tests plus the web UI tests, which drive the Microsoft Edge preinstalled on the runner.
      - name: Run tests
        run: python -m pytest -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Read version
        id: version
        run: |
          $v = python -c "import burp_report; print(burp_report.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $v in burp_report/__init__.py"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build exe
        run: pyinstaller packaging/BurpReportGenerator.spec --noconfirm --clean

      - name: Smoke test
        run: |
          $exe = "dist/BurpReportGenerator-v${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          & $exe --version
          if ($LASTEXITCODE) { throw "--version failed" }
          & $exe --list-templates
          if ($LASTEXITCODE) { throw "--list-templates failed" }
          & $exe samples/sample_burp_export.xml -y -f all -o smoke/report
          if ($LASTEXITCODE) { throw "report export failed" }
          foreach ($ext in "html", "pdf", "docx") {
            $f = "smoke/report.$ext"
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 1kb) { throw "$f missing or empty" }
            "{0,-20} {1,10:N0} bytes" -f $f, (Get-Item $f).Length
          }

      # The same web UI tests, served by the exe: catches files missing from the bundle (fonts, templates, UI).
      - name: Web UI tests against the exe
        env:
          BURP_REPORT_EXE: dist/BurpReportGenerator-v${{ steps.version.outputs.version }}.exe
        run: python -m pytest tests/e2e -v

      - name: Checksum
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            "$h  $($_.Name)"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BurpReportGenerator-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: exe-test-screenshots
          path: test-results/
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BurpReportGenerator-v${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        env:
          EXE: BurpReportGenerator-v${{ needs.build.outputs.version }}.exe
        run: |
          hash=$(cut -d' ' -f1 "dist/$EXE.sha256")
          cat > notes.md <<EOF
          ## Download

          **[$EXE](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$EXE)**: a single
          file, no installation or Python needed. Double-click it to open the report studio in your browser.
          PDF export uses the Microsoft Edge or Google Chrome already on your PC.

          ### "Windows protected your PC"

          The exe isn't code-signed, so Windows SmartScreen may warn the first time you run it.
          Click **More info → Run anyway**.

          ### Check the download

          SHA-256: \`$hash\`

          \`\`\`powershell
          (Get-FileHash .\\$EXE -Algorithm SHA256).Hash
          \`\`\`

          The result should match the hash above (also in \`$EXE.sha256\`). It was built and tested by
          [this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Burp Suite Report Generator ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
