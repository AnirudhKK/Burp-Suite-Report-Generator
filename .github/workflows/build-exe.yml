# Tests the project, builds the Windows exe and the Python package, and releases them.
#
# - Every push and pull request: run the tests; build and test the .exe and the Python package (wheel + sdist)
#   and attach them to the run.
# - Pushes (not pull requests) also record signed build provenance for the exe and the package, so anyone can
#   verify a download came from this workflow: gh attestation verify <file> --repo <owner>/<repo>
# - Pushing a tag such as v1.0.0: also publishes a GitHub Release (exe, checksum, wheel, sdist) and publishes the
#   package to PyPI. The tag must match __version__ in burp_report/__init__.py.
# - Can be started by hand from the Actions tab (workflow_dispatch).
# The exe is not code-signed; the release notes explain the SmartScreen prompt.
# Actions are pinned to full commit SHAs (version in the trailing comment), so a moved or hijacked tag can't
# change what runs here. Dependabot updates the SHA and the comment together.
name: Build and release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["**.md"]   # documentation-only pushes don't build; tag pushes always do
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Unit tests plus the web UI tests, which drive the Microsoft Edge preinstalled on the runner.
      - name: Run tests
        run: python -m pytest -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          if-no-files-found: ignore

  # The PyPI package supports Python 3.10+ on any OS: run the unit tests on Linux with the oldest and newest.
  test-python-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -m "not e2e" -v

  build:
    needs: [test, test-python-versions]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write            # sign the provenance attestation (Sigstore)
      attestations: write        # store it with the repository
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Read version
        id: version
        run: |
          $v = python -c "import burp_report; print(burp_report.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $v in burp_report/__init__.py"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build exe
        run: pyinstaller packaging/BurpReportGenerator.spec --noconfirm --clean

      - name: Smoke test
        run: |
          $exe = "dist/BurpReportGenerator-v${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          & $exe --version
          if ($LASTEXITCODE) { throw "--version failed" }
          & $exe --list-templates
          if ($LASTEXITCODE) { throw "--list-templates failed" }
          & $exe burp_report/samples/sample_burp_export.xml -y -f all -o smoke/report
          if ($LASTEXITCODE) { throw "report export failed" }
          foreach ($ext in "html", "pdf", "docx") {
            $f = "smoke/report.$ext"
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 1kb) { throw "$f missing or empty" }
            "{0,-20} {1,10:N0} bytes" -f $f, (Get-Item $f).Length
          }

      # The same web UI tests, served by the exe: catches files missing from the bundle (fonts, templates, UI).
      - name: Web UI tests against the exe
        env:
          BURP_REPORT_EXE: dist/BurpReportGenerator-v${{ steps.version.outputs.version }}.exe
        run: python -m pytest tests/e2e -v

      - name: Checksum
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            "$h  $($_.Name)"
          }

      # Signed SLSA build provenance: proves this exe was built by this workflow from this commit.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BurpReportGenerator-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: exe-test-screenshots
          path: test-results/
          if-no-files-found: ignore

  package:
    needs: [test, test-python-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      # Install the wheel into a clean environment and run it from outside the source tree, so a missing
      # template, font or the sample would fail here rather than for users.
      - name: Test the installed package
        run: |
          version=$(python -c "import burp_report; print(burp_report.__version__)")
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match __version__ $version"; exit 1
          fi
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          cd "$(mktemp -d)"
          test "$(/tmp/venv/bin/burp-report --version)" = "burp-report $version"
          /tmp/venv/bin/burp-report --list-templates
          sample=$(/tmp/venv/bin/python -c "from burp_report.web import SAMPLE_XML as s; assert s.is_file(); print(s)")
          /tmp/venv/bin/burp-report "$sample" -y -f html,docx -o out/report
          test -s out/report.html && test -s out/report.docx
          ls -l out

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  # Publishes to https://pypi.org/p/burp-report-generator with PyPI Trusted Publishing: no API token is stored;
  # PyPI trusts this workflow + the "pypi" environment (set up once on pypi.org, see Documentation.md).
  pypi:
    if: github.ref_type == 'tag'
    needs: [build, package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/burp-report-generator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    if: github.ref_type == 'tag'
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BurpReportGenerator-v${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist

      - name: Write release notes
        env:
          EXE: BurpReportGenerator-v${{ needs.build.outputs.version }}.exe
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          hash=$(cut -d' ' -f1 "dist/$EXE.sha256")
          cat > notes.md <<EOF
          ## Download

          **Windows: [$EXE](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$EXE)**,
          a single file with no installation or Python needed. Double-click it to open the report studio in your
          browser. PDF export uses the Microsoft Edge or Google Chrome already on your PC.

          **Any OS with Python 3.10+:**

          \`\`\`
          pip install burp-report-generator==$VERSION
          burp-report
          \`\`\`

          ### "Windows protected your PC"

          The exe isn't code-signed, so Windows SmartScreen may warn the first time you run it.
          Click **More info → Run anyway**.

          ### Check the download

          SHA-256 of the exe: \`$hash\`

          \`\`\`powershell
          (Get-FileHash .\\$EXE -Algorithm SHA256).Hash
          \`\`\`

          Every file in this release has signed build provenance. To prove a file was built by
          [this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) from
          this repository's source, use the [GitHub CLI](https://cli.github.com/):

          \`\`\`
          gh attestation verify $EXE --repo ${{ github.repository }}
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Burp Suite Report Generator ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.sha256
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
