# Builds the single-file Windows executable with PyInstaller.
#
# - Every push and pull request: build, smoke-test, and attach the .exe to the run as a downloadable artifact.
# - Pushing a tag such as v1.0.0: also publishes a GitHub Release with the .exe and its SHA-256 checksum.
#   The tag must match __version__ in burp_report/__init__.py.
# - Can be started by hand from the Actions tab (workflow_dispatch).
name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read version
        id: version
        run: |
          $v = python -c "import burp_report; print(burp_report.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $v in burp_report/__init__.py"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller packaging/BurpReportGenerator.spec --noconfirm --clean

      - name: Smoke test
        run: |
          $exe = "dist/BurpReportGenerator-v${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          & $exe --version
          if ($LASTEXITCODE) { throw "--version failed" }
          & $exe --list-templates
          if ($LASTEXITCODE) { throw "--list-templates failed" }
          # Edge is preinstalled on GitHub's Windows runners, so PDF export is tested too.
          & $exe samples/sample_burp_export.xml -y -f all -o smoke/report
          if ($LASTEXITCODE) { throw "report export failed" }
          foreach ($ext in "html", "pdf", "docx") {
            $f = "smoke/report.$ext"
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 1kb) { throw "$f missing or empty" }
            "{0,-20} {1,10:N0} bytes" -f $f, (Get-Item $f).Length
          }

      - name: Checksum
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            "$h  $($_.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BurpReportGenerator-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BurpReportGenerator-v${{ needs.build.outputs.version }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Burp Suite Report Generator ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
