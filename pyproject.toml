[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burp-report-generator"
dynamic = ["version"]   # read from burp_report/__init__.py
description = "Turn Burp Suite Professional XML exports into client-ready HTML, PDF and Word security reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]   # the fonts' OFL licence texts ship next to each font in burp_report/fonts/
authors = [{ name = "AnirudhKK" }]
keywords = ["burp", "burp-suite", "pentest", "penetration-testing", "security", "report", "owasp", "vulnerability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing :: Markup :: HTML",
]
# Keep in step with requirements.txt (tests/test_packaging.py checks this).
dependencies = [
    "Jinja2>=3.1",
    "rich>=13.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
pdf = ["weasyprint"]   # PDF fallback when no Edge/Chrome/Chromium is installed

[project.scripts]
burp-report = "burp_report.cli:main"

[project.urls]
Homepage = "https://github.com/AnirudhKK/Burp-Suite-Report-Generator"
Documentation = "https://github.com/AnirudhKK/Burp-Suite-Report-Generator/blob/main/Documentation.md"
Changelog = "https://github.com/AnirudhKK/Burp-Suite-Report-Generator/blob/main/CHANGELOG.md"
Issues = "https://github.com/AnirudhKK/Burp-Suite-Report-Generator/issues"
Releases = "https://github.com/AnirudhKK/Burp-Suite-Report-Generator/releases"

[tool.setuptools.packages.find]
include = ["burp_report*"]   # the package plus its data folders (templates, fonts, webui, samples)

[tool.setuptools.package-data]
burp_report = ["templates/**/*", "fonts/*", "webui/*", "samples/*"]

[tool.setuptools.dynamic]
version = { attr = "burp_report.__version__" }
